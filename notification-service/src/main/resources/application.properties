spring.application.name=notification-service
server.port=${PORT:8083}
# Supabase Session Pooler connection -- works on KNUST Wi-Fi
 spring.datasource.url=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:6543/postgres
spring.datasource.username=postgres.ixcsmidbwmtrhhrdkurz
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Schema: use notif_schema only ───────────────────────────────
# This tells Spring Boot to look inside notif_schema for all tables
spring.jpa.properties.hibernate.default_schema=notif_schema

# ── Hibernate settings ──────────────────────────────────────────
# validate = Spring checks tables exist but does NOT create or change them
# Use validate because you already created the tables in Supabase
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET:}